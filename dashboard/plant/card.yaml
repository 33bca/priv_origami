type: custom:bubble-card
card_type: button
button_type: state
entity: plant.houseplant
name: >-
  {{ state_attr('plant.houseplant', 'friendly_name')
     if state_attr('plant.houseplant', 'friendly_name') is not none else 'Plant' }}
icon: >-
  {%- set prob = state_attr('plant.houseplant', 'problem') | string -%}
  {%- if states('plant.houseplant') in ['unknown', 'unavailable'] -%}mdi:help
  {%- elif states('plant.houseplant') == 'problem' -%}
    {{ 'mdi:close-thick' if 'temperature' in prob or 'moisture low' in prob else 'mdi:exclamation-thick' }}
  {%- else -%}mdi:check-bold{%- endif -%}
state_content: >-
  {%- set prob = state_attr('plant.houseplant', 'problem') | string -%}
  {%- if states('plant.houseplant') in ['unknown', 'unavailable'] -%}Unavailable
  {%- elif states('plant.houseplant') == 'problem' -%}
    {%- if 'moisture low' in prob -%}Needs water
    {%- elif 'moisture high' in prob -%}Soil too wet
    {%- elif 'conductivity low' in prob -%}Needs fertilizer
    {%- elif 'conductivity high' in prob -%}Too much fertilizer
    {%- elif 'temperature low' in prob -%}Too cold
    {%- elif 'temperature high' in prob -%}Too hot
    {%- elif 'battery' in prob -%}Low battery
    {%- else -%}Needs attention
    {%- endif -%}
  {%- else -%}All good{%- endif -%}
modules:
  - origami_base
tap_action:
  action: more-info
button_action:
  tap_action:
    action: more-info
sub_button:
  main:
    - entity: plant.houseplant
      show_icon: false
      origami_base:
        name: "${num(attr.moisture, 0, '%') || '–'}"
        label: Soil
        name_color: >-
          ${String(attr.problem ?? '').includes('moisture low') ? 'var(--error-color)' :
          String(attr.problem ?? '').includes('moisture high') ? 'var(--warning-color)' : ''}
      tap_action:
        action: more-info
    - entity: plant.houseplant
      show_icon: false
      origami_base:
        name: "${num(attr.conductivity, 0) || '–'}"
        label: µS/cm
        name_color: "${String(attr.problem ?? '').includes('conductivity') ? 'var(--warning-color)' : ''}"
      tap_action:
        action: more-info
styles: |-
  ha-card .bubble-icon-container .bubble-icon {
    color: ${(s => !s || ['unknown', 'unavailable'].includes(s.state)
      ? 'var(--secondary-text-color)' : s.state === 'problem'
      ? /temperature|moisture low/.test(String(s.attributes?.problem ?? ''))
        ? 'var(--error-color)' : 'var(--warning-color)' : 'var(--success-color)')
      (hass.states['plant.houseplant'])} !important;
    --icon-primary-color: currentColor;
  }
