                else 'Updates' }} {%- else -%}Alles in Ordnung {%- endif -%}
              state_content: >-
                {%- set n =
                as_timestamp(states('sensor.system_monitor_betriebszeit'),
                default=none) -%} {%- set d = [(now().timestamp() - n) | int, 0]
                | max if n is not none else -1 -%} {%- if d < 0 -%}Betriebszeit
                unbekannt {%- elif d >= 86400 -%}Seit {{ d // 86400 }} {{ 'Tag'
                if d < 172800 else 'Tage' }} {%- elif d >= 3600 -%}Seit {{ d //
                3600 }} {{ 'Stunde' if d < 7200 else 'Stunden' }} {%- else
                -%}Seit {{ [d // 60, 1] | max }} {{ 'Minute' if d < 120 else
                'Minuten' }} {%- endif -%}
