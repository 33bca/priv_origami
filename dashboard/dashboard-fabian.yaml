title: Home
views:
  - type: sections
    title: Home
    path: home
    icon: mdi:home-heart
    max_columns: 2
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: grid
            square: false
            columns: 1
            visibility:
              - condition: screen
                media_query: '(min-width: 768px)'
            grid_options:
              columns: 24
              rows: auto
            cards:
              - type: custom:paper-buttons-row
                base_config:
                  layout: icon
                  styles:
                    button:
                      height: 0px
                      pointer-events: none
                    icon:
                      --mdc-icon-size: 0px
                buttons:
                  - icon: mdi:backspace-reverse
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:paper-buttons-row
                extra_styles: ':host { display: block; height: 100% }'
                styles:
                  flex-direction: column
                  justify-content: center
                  height: 100%
                  gap: var(--ha-space-1)
                base_config:
                  layout: state
                  tap_action:
                    action: none
                  styles:
                    button:
                      min-height: unset
                      padding: 0px
                      align-self: flex-start
                      justify-content: flex-start
                      pointer-events: none
                    state:
                      padding: 0px
                buttons:
                  - name: user
                    state: '{{ user }}'
                    styles:
                      name:
                        font-size: var(--ha-font-size-s)
                        font-weight: var(--ha-font-weight-bold)
                        color: var(--secondary-text-color)
                        white-space: nowrap
                        overflow: hidden
                        text-overflow: ellipsis
                        max-width: 100px
                  - entity: sensor.greetings
                    state:
                      case: first
                    styles:
                      state:
                        font-size: var(--ha-font-size-l)
                        font-weight: var(--ha-font-weight-bold)
                        white-space: nowrap
                        overflow: hidden
                        text-overflow: ellipsis
              - type: custom:origami-notifications
                label: alarm
                weather: weather.weather_at_4310
                hide_when_empty: false
                rotate: 3
                css: >
                  :host {
                    --origami-pad: var(--ha-space-4);
                    --origami-gap: var(--ha-space-4);
                    --origami-tile: var(--ha-space-9, 36px);
                    --origami-icon: var(--icon-size-m);
                    --origami-radius: var(--radius-inner);
                    --origami-card-bg: var(--fill-subtle);
                    --origami-row-bg: var(--fill-subtle);
                    --accent-color: var(--fill-active);
                    --ha-tile-info-primary-font-size: var(--ha-font-size-m);
                    --ha-tile-info-primary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-font-size: var(--ha-font-size-s);
                    --ha-tile-info-secondary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-color: var(--secondary-text-color);
                  }

                  ha-card { box-shadow: none; }

                  .texts { min-height: calc(var(--origami-tile) + 2 *
                  var(--origami-pad)); }

                  .slide { gap: var(--ha-space-1); }

                  .icon {
                    border-radius: calc(var(--origami-tile) * var(--radius-ratio, 0.35));
                    background: color-mix(in srgb, var(--tile-color) var(--tint-strength), var(--ha-card-background, var(--card-background-color)));
                    box-shadow: var(--ha-card-box-shadow, none);
                  }

                  .head .icon.idle { color: var(--primary-text-color); }

                  .badge {
                    top: -6px;
                    inset-inline-end: -6px;
                    min-width: 20px;
                    height: 20px;
                    padding: 0 6px;
                    border-radius: 10px;
                    font-size: 12px;
                    font-weight: var(--ha-font-weight-bold);
                    box-shadow: none;
                  }

                  .list { gap: var(--ha-space-2); }

                  .row { padding: var(--ha-space-3); }

                  .row .title {
                    font-size: var(--ha-font-size-m);
                    font-weight: var(--ha-font-weight-bold);
                  }

                  .row .message { font-size: var(--ha-font-size-s); }
          - type: custom:origami-weather
            weather_entity: weather.weather_at_4310
            sun_enabled: false
            moon_enabled: false
            color_mode: theme
            card_height: 160px
            card_padding: 20px
            background_mode: color
            background_threshold_entity: weather.weather_at_4310
            background_thresholds:
              - value: sunny
                color: '#e7e2d9'
                color_dark: '#24211d'
              - value: clear-night
                color: '#dbdce1'
                color_dark: '#15181f'
              - value: partlycloudy
                color: '#e0deda'
                color_dark: '#1c2023'
              - value: cloudy
                color: '#d3d4d6'
                color_dark: '#222324'
              - value: fog
                color: '#e6e6e5'
                color_dark: '#272829'
              - value: windy
                color: '#dadfdd'
                color_dark: '#1c201e'
              - value: windy-variant
                color: '#d5dad9'
                color_dark: '#1a1f1e'
              - value: rainy
                color: '#cdd2d6'
                color_dark: '#181e22'
              - value: pouring
                color: '#c8cdd2'
                color_dark: '#14191e'
              - value: lightning
                color: '#cfced3'
                color_dark: '#1c1b21'
              - value: lightning-rainy
                color: '#cacacf'
                color_dark: '#18171e'
              - value: snowy
                color: '#e6eaed'
                color_dark: '#252b2e'
              - value: snowy-rainy
                color: '#d8dddf'
                color_dark: '#1f2527'
              - value: hail
                color: '#d2d9da'
                color_dark: '#1c2324'
              - value: exceptional
                color: '#ded8d2'
                color_dark: '#27221f'
            card_offset: 16px 0px 12px 0px
            cloud_effects: false
            night_sky_effects: false
            bird_effects: false
            balloon_effects: false
            plane_effects: false
            grid_options:
              rows: auto
              columns: 12
            button_containers:
              - position: custom
                position_anchor: top-right
                position_x: -32px
                position_y: -10px
                custom_width: 168px
                image: demo-home-image
              - position: custom
                position_anchor: top-left
                button_gap: 6px
                buttons:
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: above_horizon
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--secondary-text-color)
                        text: Sonnenuntergang
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)
                        entity: sun.sun
                        attribute: next_setting
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: below_horizon
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--secondary-text-color)
                        text: Sonnenaufgang
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)
                        entity: sun.sun
                        attribute: next_rising
              - position: custom
                position_anchor: bottom-left
                gap: 5px
                buttons:
                  - entity: weather.home
                    width: 100%
                    elements:
                      - type: text
                        size: 48px
                        weight: '700'
                        color: var(--primary-text-color)
                        attribute: temperature
                        precision: 0
                        format: °
                  - entity: weather.home
                    elements:
                      - type: text
                        size: 12px
                        weight: '500'
                        color: var(--primary-text-color)
          - type: custom:bubble-card
            card_type: separator
            name: Favorites
            modules:
              - origami_base
              - origami_header
            origami_header:
              icon_size: var(--icon-size-m)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: Alle
                  icon: mdi:chevron-right
                  show_name: true
                  content_layout: icon-right
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_favorites'
          - type: custom:bubble-card
            card_type: sub-buttons
            modules:
              - origami_base
              - origami_tiles
            grid_options:
              columns: full
              rows: auto
            sub_button:
              bottom:
                - name: Zutritt
                  entity: binary_sensor.wohnzimmer_nuki_eingang_door_open
                  icon: mdi:door
                  force_icon: true
                  origami_tiles:
                    color: var(--green-color)
                  visibility: []
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_lock'
                  hold_action:
                    action: more-info
                  scrolling_effect: true
                  show_background: true
                  state_background: true
                  show_icon: true
                - name: K2 Pro
                  entity: sensor.k2pro_print_status
                  icon: mdi:printer-3d
                  force_icon: true
                  origami_tiles:
                    state:
                      cleaning: Reinigen
                      'false': Aus
                      error: Fehler!
                      self-testing: Selbsttest
                      completed: Fertig
                      paused: Pausiert
                      stopped: Gestoppt
                      printing: Drucken
                      processing: Verarbeiten
                      idle: Ruhezustand
                    color: var(--blue-color)
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_printer'
                  hold_action:
                    action: none
                  double_tap_action:
                    action: none
                - name: R2-D2
                  entity: vacuum.r2_d2
                  icon: mdi:robot-vacuum-variant
                  force_icon: true
                  origami_tiles:
                    color: var(--orange-color)
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_vacuum'
                  hold_action:
                    action: more-info
                  show_name: false
                - name: Ofen
                  entity: sensor.kuche_ofen_geratestatus
                  timer_entity: number.kuche_ofen_zieldauer
                  force_icon: true
                  origami_tiles:
                    color: var(--purple-color)
                    state:
                      Ready To Start: Startbereit
                      ready to start: Startbereit
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_oven'
                  hold_action:
                    action: more-info
                  show_name: false
                  icon: mdi:stove
                  styles: |
                    ${(() => {
                      setTimeout(() => {
                        const root = card.shadowRoot || card;
                        const timerSt = hass.states['number.kuche_ofen_zieldauer'];
                        const mainSt = hass.states['sensor.kuche_ofen_geratestatus'];
                        const stateEl = root.querySelector('.bubble-state') || root.querySelector('.state') || card.querySelector('.bubble-state');

                        if (stateEl) {
                          const timerVal = timerSt ? parseFloat(timerSt.state) : 0;
                          let displayText = "Startbereit";

                          if (!isNaN(timerVal) && timerVal > 0) {
                            displayText = typeof hass.formatEntityState === "function" 
                              ? hass.formatEntityState(timerSt) 
                              : `${timerSt.state} Min.`;
                          } else if (mainSt) {
                            const rawState = String(mainSt.state).toLowerCase().trim();
                            if (rawState === "ready to start" || rawState === "ready_to_start" || rawState === "off" || rawState === "idle") {
                              displayText = "Startbereit";
                            } else if (typeof hass.formatEntityState === "function") {
                              displayText = hass.formatEntityState(mainSt);
                            } else {
                              displayText = mainSt.state;
                            }
                          }

                          if (stateEl.innerText !== displayText) {
                            stateEl.innerText = displayText;
                          }
                        }
                      }, 0);
                      return "";
                    })()}
            hide_main_background: false
            footer_mode: false
            styles: |-
              .bubble-sub-button-name-container::after {
                max-width: min(var(--org-tile-state-max,100px),100%);
              }
        theme: Origami
      - type: grid
        column_span: 1
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Zimmer
            modules:
              - origami_base
              - origami_header
            origami_header:
              value_style: chip
              icon_size: var(--icon-size-l)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: Temperature
                  entity: sensor.climate_home
                  icon: mdi:thermometer
                  origami_header:
                    name: ${num(attr.temperature_average)}°
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.toggle
                    target:
                      entity_id: input_boolean.room_climate_card
                  hold_action:
                    action: more-info
                - name: Windows
                  entity: sensor.climate_home
                  icon: mdi:window-closed-variant
                  state_content: windows_open
                  origami_header:
                    icon: '${attr.windows_open > 0 ? ''mdi:window-open-variant'' : ''''}'
                    name_color: >-
                      ${attr.windows_open > 0 ?
                      'var(--state-binary_sensor-window-on-color)' :
                      'var(--secondary-text-color)'}
                    background: '${attr.windows_open > 0 ? ''var(--tint)'' : ''''}'
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.toggle
                    target:
                      entity_id: input_boolean.room_climate_card
                  hold_action:
                    action: more-info
                - name: Table
                  entity: input_boolean.room_climate_card
                  icon: mdi:chevron-down
                  show_background: false
                  origami_header:
                    icon:
                      'on': mdi:chevron-up
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info
          - type: custom:bubble-card
            card_type: sub-buttons
            modules:
              - origami_base
              - origami_table
            origami_base:
              animate: true
            origami_table:
              columns:
                - name: room
                  icon: mdi:circle
                  color_template: ${attr.color_code ?? "transparent"}
                - name: window
                  icon_states:
                    'on': mdi:window-open-variant
                    'off': mdi:window-closed-variant
                - name: thermostat
                  icon: mdi:thermostat
                  text_template: ${num(attr.temperature)}°
                - name: door
                  width: 1fr
                  align: start
                  icon_states:
                    'on': mdi:door-open
                    'off': mdi:door-closed
                - name: temperature
                  icon_template: >-
                    ${attr.temp_rank === 'warmest' ? 'mdi:arrow-up' :
                    attr.temp_rank === 'coldest' ? 'mdi:arrow-down' :
                    'mdi:thermometer'}
                  color_template: >-
                    ${attr.temp_rank === 'coldest' ?
                    'var(--secondary-text-color)' : ''}
                  text_template: ${num(attr.temperature)}°
                  'on': ${attr.temp_rank === 'warmest'}
                - name: humidity
                  icon_template: >-
                    ${attr.humidity_rank === 'most_humid' ? 'mdi:arrow-up' :
                    attr.humidity_rank === 'driest' ? 'mdi:arrow-down' :
                    'mdi:water-percent'}
                  color_template: >-
                    ${attr.humidity_rank === 'driest' ?
                    'var(--secondary-text-color)' : ''}
                  text_template: ${num(attr.humidity, 0, '%')}
                  'on': ${attr.humidity_rank === 'most_humid'}
            grid_options:
              columns: full
              rows: auto
            visibility:
              - condition: state
                entity: input_boolean.room_climate_card
                state: 'on'
            styles: |-
              ha-card {
                margin-bottom: var(--ha-space-5);
              }
            sub_button:
              bottom_layout: rows
              main: []
              bottom:
                - name: Wohnen
                  group:
                    - entity: sensor.climate_living_room
                      css_class: room
                      name: Wohnen
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_gang
                    - entity: binary_sensor.wohnzimmer_fenster
                      css_class: window
                    - entity: climate.thermometer_gang
                      css_class: thermostat
                    - entity: binary_sensor.nuki_eingang_locked
                      css_class: door
                    - entity: sensor.climate_living_room
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_gang
                    - entity: sensor.climate_living_room
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_gang
                - name: Schlafzimmer
                  group:
                    - entity: sensor.climate_bedroom
                      css_class: room
                      name: Schlafzimmer
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_schlafzimmer
                    - entity: binary_sensor.schlafzimmer_fenster
                      css_class: window
                    - entity: climate.thermometer_schlafzimmer
                      css_class: thermostat
                    - entity: sensor.climate_bedroom
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_schlafzimmer
                    - entity: sensor.climate_bedroom
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_schlafzimmer
                - name: Büro
                  group:
                    - entity: sensor.climate_office
                      css_class: room
                      name: Büro
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_buero
                    - entity: binary_sensor.buro_fenster
                      css_class: window
                    - entity: climate.thermometer_buero
                      css_class: thermostat
                    - entity: sensor.climate_office
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_buero
                    - entity: sensor.climate_office
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_buero
                - name: Bad
                  group:
                    - entity: sensor.climate_bathroom
                      css_class: room
                      name: Bad
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_bad
                    - entity: climate.thermometer_bad
                      css_class: thermostat
                    - entity: sensor.climate_bathroom
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_bad
                    - entity: sensor.climate_bathroom
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_bad
                - name: WC
                  group:
                    - entity: sensor.climate_shower
                      css_class: room
                      name: WC
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_dusche
                    - entity: climate.thermometer_dusche
                      css_class: thermostat
                    - entity: sensor.climate_shower
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_dusche
                    - entity: sensor.climate_shower
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: climate.thermometer_dusche
                - name: Balkon
                  group:
                    - entity: sensor.climate_balcony
                      css_class: room
                      name: Balkon
                      show_name: true
                      tap_action:
                        action: more-info
                        entity: sensor.vindstyrka_temperature
                    - entity: binary_sensor.balkon_tur
                      css_class: door
                    - entity: sensor.climate_balcony
                      css_class: temperature
                      tap_action:
                        action: more-info
                        entity: sensor.vindstyrka_temperature
                    - entity: sensor.climate_balcony
                      css_class: humidity
                      tap_action:
                        action: more-info
                        entity: sensor.vindstyrka_humidity
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.wohnzimmer_wohnen
                name: Wohnen
                icon: mdi:sofa
                modules:
                  - origami_base
                origami_base:
                  tile: true
                  vertical: true
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_living_room'
                  hold_action:
                    action: more-info
                sub_button:
                  main:
                    - icon: mdi:chevron-right
                  bottom:
                    - entity: sensor.climate_living_room
                      icon: mdi:circle
                      origami_base:
                        color: ${attr.color_code ?? "transparent"}
                    - entity: binary_sensor.wohnzimmer_fenster
                      icon: mdi:window-closed-variant
                      origami_base:
                        icon:
                          'on': mdi:window-open-variant
                    - entity: sensor.climate_living_room
                      show_icon: false
                      origami_base:
                        name: ${num(attr.temperature)}° |
                    - entity: sensor.climate_living_room
                      show_icon: false
                      origami_base:
                        name: ${num(attr.humidity, 0, '%')}
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.balkon_deckenlampe
                name: Balkon
                icon: mdi:balcony
                modules:
                  - origami_base
                origami_base:
                  tile: true
                  vertical: true
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_balcony'
                  hold_action:
                    action: more-info
                sub_button:
                  main:
                    - icon: mdi:chevron-right
                  bottom:
                    - entity: sensor.climate_balcony
                      icon: mdi:circle
                      origami_base:
                        color: ${attr.color_code ?? "transparent"}
                    - entity: binary_sensor.balkon_tur
                      icon: mdi:door-closed
                      origami_base:
                        icon:
                          'on': mdi:door-open
                    - entity: sensor.climate_balcony
                      show_icon: false
                      origami_base:
                        name: ${num(attr.temperature)}° |
                    - entity: sensor.climate_balcony
                      show_icon: false
                      origami_base:
                        name: ${num(attr.humidity, 0, '%')}
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.schlafzimmer_raum
                name: Schlafen
                icon: mdi:bed
                modules:
                  - origami_base
                origami_base:
                  tile: true
                  vertical: true
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_bedroom'
                  hold_action:
                    action: more-info
                sub_button:
                  main:
                    - icon: mdi:chevron-right
                  bottom:
                    - entity: sensor.climate_bedroom
                      icon: mdi:circle
                      origami_base:
                        color: ${attr.color_code ?? "transparent"}
                    - entity: binary_sensor.schlafzimmer_fenster
                      icon: mdi:window-closed-variant
                      origami_base:
                        icon:
                          'on': mdi:window-open-variant
                    - entity: sensor.climate_bedroom
                      show_icon: false
                      origami_base:
                        name: ${num(attr.temperature)}° |
                    - entity: sensor.climate_bedroom
                      show_icon: false
                      origami_base:
                        name: ${num(attr.humidity, 0, '%')}
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.buro_raum
                name: Büro
                icon: mdi:chair-rolling
                modules:
                  - origami_base
                origami_base:
                  tile: true
                  vertical: true
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_office'
                  hold_action:
                    action: more-info
                sub_button:
                  main:
                    - icon: mdi:chevron-right
                  bottom:
                    - entity: sensor.climate_office
                      icon: mdi:circle
                      origami_base:
                        color: ${attr.color_code ?? "transparent"}
                    - entity: binary_sensor.buro_fenster
                      icon: mdi:window-closed-variant
                      origami_base:
                        icon:
                          'on': mdi:window-open-variant
                    - entity: sensor.climate_office
                      show_icon: false
                      origami_base:
                        name: ${num(attr.temperature)}° |
                    - entity: sensor.climate_office
                      show_icon: false
                      origami_base:
                        name: ${num(attr.humidity, 0, '%')}
              - type: custom:bubble-card
                card_type: button
                button_type: name
                entity: light.badezimmer_raum
                name: Bad
                icon: mdi:bathtub
                modules:
                  - origami_base
                origami_base:
                  tile: true
                  vertical: true
                button_action:
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_bathroom'
                  hold_action:
                    action: more-info
                sub_button:
                  main:
                    - icon: mdi:chevron-right
                  bottom:
                    - entity: sensor.climate_bathroom
                      icon: mdi:circle
