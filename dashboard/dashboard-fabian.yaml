                not none else 0 -%} {%- set u = states.update |
                selectattr('state', 'eq', 'on') | list | count -%} {%- if s > 90
                -%}Disk almost full {%- elif r > 95 -%}Memory low {%- elif c >
                95 -%}CPU high {%- elif a > 259200 -%}Backup due {%- elif s > 80
                -%}Disk almost full {%- elif r > 85 -%}Memory low {%- elif c >
                80 -%}CPU high {%- elif c < 0 and r < 0 and s < 0 -%}No data {%-
                elif u > 0 -%}{{ u }} {{ 'update' if u == 1 else 'updates' }}
                {%- else -%}All good {%- endif -%}
              state_content: >-
                {%- set n =
                as_timestamp(states('sensor.system_monitor_betriebszeit'),
                default=none) -%} {%- set d = [(now().timestamp() - n) | int, 0]
                | max if n is not none else -1 -%} {%- if d < 0 -%}Uptime
                unknown {%- elif d >= 86400 -%}Up {{ d // 86400 }} {{ 'day' if d
                < 172800 else 'days' }} {%- elif d >= 3600 -%}Up {{ d // 3600 }}
                {{ 'hour' if d < 7200 else 'hours' }} {%- else -%}Up {{ [d //
                60, 1] | max }} {{ 'minute' if d < 120 else 'minutes' }} {%-
                endif -%}
              scrolling_effect: false
