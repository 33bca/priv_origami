                float(-1) -%} {%- set r =
                states('sensor.system_monitor_arbeitsspeicherauslastung') |
                float(-1) -%} {%- set s =
                states('sensor.system_monitor_massenspeicher_auslastung') |
                float(-1) -%} {%- set b =
                as_timestamp(states('sensor.backup_last_successful_automatic_backup'),
