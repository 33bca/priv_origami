title: Home
views:
  - type: sections
    title: Home
    path: home
    icon: mdi:home-heart
    max_columns: 2
    dense_section_placement: false
    sections:
      - type: grid
        column_span: 1
        cards:
          - type: grid
            square: false
            columns: 2
            cards:
              - type: custom:bubble-card
                card_type: separator
                name: "${(h => h < 5 ? 'Noch wach?' : h < 22 ? 'Na, hallo!' : 'Schlaf gut!')(new Date().getHours())}"
                modules:
                  - origami_base
                  - origami_header
                origami_header:
                  value_position: above
                  value_size: var(--ha-font-size-s)
                  value_max_width: 100px
                sub_button:
                  main:
                    - show_icon: false
                      scrolling_effect: false
                      origami_header:
                        name: "${hass.user?.name ?? ''}"
                        name_color: var(--secondary-text-color)
                      tap_action:
                        action: none
              - type: custom:origami-notifications
                label: alarm
                weather: weather.weather_at_4310
                hide_when_empty: false
                rotate: 3
                css: >
                  :host {
                    --origami-pad: var(--ha-space-4);
                    --origami-gap: var(--ha-space-4);
                    --origami-tile: var(--ha-space-9, 36px);
                    --origami-icon: var(--icon-size-m);
                    --origami-radius: var(--radius-inner);
                    --origami-card-bg: var(--fill-subtle);
                    --origami-row-bg: var(--fill-subtle);
                    --accent-color: var(--fill-active);
                    --ha-tile-info-primary-font-size: var(--ha-font-size-m);
                    --ha-tile-info-primary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-font-size: var(--ha-font-size-s);
                    --ha-tile-info-secondary-font-weight: var(--ha-font-weight-bold);
                    --ha-tile-info-secondary-color: var(--secondary-text-color);
                  }

                  ha-card { box-shadow: none; }

                  .texts { min-height: calc(var(--origami-tile) + 2 *
                  var(--origami-pad)); }

                  .slide { gap: var(--ha-space-1); }

                  .icon {
                    border-radius: calc(var(--origami-tile) * var(--radius-ratio, 0.35));
                    background: color-mix(in srgb, var(--tile-color) var(--tint-strength), var(--ha-card-background, var(--card-background-color)));
                    box-shadow: var(--ha-card-box-shadow, none);
                  }

                  .head .icon.idle { color: var(--primary-text-color); }

                  .badge {
                    top: -6px;
                    inset-inline-end: -6px;
                    min-width: 20px;
                    height: 20px;
                    padding: 0 6px 0 6px;
                    border-radius: 10px;
                    font-size: 12px;
                    font-weight: var(--ha-font-weight-bold);
                    box-shadow: none;
                  }

                  .list { gap: var(--ha-space-2); }

                  .row { padding: var(--ha-space-3); }

                  .row .title {
                    font-size: var(--ha-font-size-m);
                    font-weight: var(--ha-font-weight-bold);
                  }

                  .row .message { font-size: var(--ha-font-size-s); }
          - type: custom:origami-weather
            weather_entity: weather.weather_at_4310
            color_mode: theme
            card_height: 150px
            card_padding: 0px 0px 0px 0px
            card_offset: 20px 0px 0px 0px
            card_tap_action:
              action: more-info
            sun_moon_size: 40
            sun_moon_x: dynamic
            shadow_color: var(--tile-chip-shadow)
            cloud_effects: false
            background_mode: images
            weather_image_path: https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/
            weather_image_path_dark: https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/
            grid_options:
              columns: 12
              rows: auto
            content_direction: row
            content_align: end
            css: >
              /* Origami Weather with the Origami theme's values */

              :host {
                --origami-text-light: var(--primary-text-color);
                --origami-text-dark: var(--primary-text-color);
                --origami-bottom-font-weight: var(--ha-font-weight-normal);
                --origami-bottom-bg-filter: var(--blur-soft);
                /* A chip's corner is 35 % of its height: the text and 6px above and below it */
                --origami-bottom-bg-radius: calc((1em + 12px) * var(--radius-ratio));
              }

              /* The pictures have a clear sky, and the card paints the paper in
              the weather's color. Each picture is also the mask of the sky,
                 so the sun, the moon and the stars show only in the open sky and set behind the hills, the trees and the clouds. */
              #card-root { --paper: #e2e5e7; --sky: none; }

              #card-root.scheme-dark { --paper: #1b1e20; }

              #card-root.weather-sunny { --paper: #eee5d7; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/sunny.webp");
              }

              #card-root.scheme-dark.weather-sunny { --paper: #261d13; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/sunny.webp");
              }

              #card-root.weather-partlycloudy { --paper: #dee9ef; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/partlycloudy.webp");
              }

              #card-root.scheme-dark.weather-partlycloudy { --paper: #182227;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/partlycloudy.webp");
              }

              #card-root.weather-cloudy { --paper: #e2e5e7; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/cloudy.webp");
              }

              #card-root.scheme-dark.weather-cloudy { --paper: #1b1e20; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/cloudy.webp");
              }

              #card-root.weather-fog { --paper: #e8e7e5; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/fog.webp");
              }

              #card-root.scheme-dark.weather-fog { --paper: #222120; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/fog.webp");
              }

              #card-root.weather-rainy { --paper: #d9e1ea; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/rainy.webp");
              }

              #card-root.scheme-dark.weather-rainy { --paper: #171e26; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/rainy.webp");
              }

              #card-root.weather-pouring { --paper: #d7dde4; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/pouring.webp");
              }

              #card-root.scheme-dark.weather-pouring { --paper: #151b21; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/pouring.webp");
              }

              #card-root.weather-lightning { --paper: #e5dfe8; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/lightning.webp");
              }

              #card-root.scheme-dark.weather-lightning { --paper: #221d25;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/lightning.webp");
              }

              #card-root.weather-lightning-rainy { --paper: #dfdbe2; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/lightning-rainy.webp");
              }

              #card-root.scheme-dark.weather-lightning-rainy { --paper: #1d1920;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/lightning-rainy.webp");
              }

              #card-root.weather-hail { --paper: #d3dfdf; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/hail.webp");
              }

              #card-root.scheme-dark.weather-hail { --paper: #121c1c; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/hail.webp");
              }

              #card-root.weather-snowy { --paper: #e5eaec; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/snowy.webp");
              }

              #card-root.scheme-dark.weather-snowy { --paper: #1c2426; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/snowy.webp");
              }

              #card-root.weather-snowy-rainy { --paper: #dde2e5; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/snowy-rainy.webp");
              }

              #card-root.scheme-dark.weather-snowy-rainy { --paper: #1e2124;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/snowy-rainy.webp");
              }

              #card-root.weather-windy { --paper: #dce6e3; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/windy.webp");
              }

              #card-root.scheme-dark.weather-windy { --paper: #182220; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/windy.webp");
              }

              #card-root.weather-windy-variant { --paper: #dae1de; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/windy-variant.webp");
              }

              #card-root.scheme-dark.weather-windy-variant { --paper: #171d1b;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/windy-variant.webp");
              }

              #card-root.weather-clear-night { --paper: #e0e3ed; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/clear-night.webp");
              }

              #card-root.scheme-dark.weather-clear-night { --paper: #161924;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/clear-night.webp");
              }

              #card-root.weather-exceptional { --paper: #eadad3; --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/light/exceptional.webp");
              }

              #card-root.scheme-dark.weather-exceptional { --paper: #271a15;
              --sky:
              url("https://cdn.jsdelivr.net/gh/hazymorning/origami@main/dashboard/weather/diorama/dark/exceptional.webp");
              }

              #card-root.scheme-light, #card-root.scheme-dark {
              background-color: var(--paper); }

              /* The landscape stands at the bottom left, however wide the card
              is */

              #weather-bg > img { object-position: left bottom; }

              #card-root.has-weather-bg :is(#sun-moon-layer, #star-canvas) {
                -webkit-mask-image: var(--sky), linear-gradient(#000 0 0);
                -webkit-mask-position: left bottom, 0 0;
                -webkit-mask-size: cover, 100% 100%;
                -webkit-mask-repeat: no-repeat;
                -webkit-mask-composite: xor;
                mask-image: var(--sky), linear-gradient(#000 0 0);
                mask-position: left bottom, 0 0;
                mask-size: cover, 100% 100%;
                mask-repeat: no-repeat;
                mask-composite: exclude;
              }

              /* The paper changes softly with the weather, and a new picture
              fades in */

              @media (prefers-reduced-motion: no-preference) {
                #card-root.scheme-light, #card-root.scheme-dark { transition: background-color 1.2s var(--ease-standard), transform .4s cubic-bezier(.2, 0, .2, 1); }
                #weather-bg > img { animation: appear .9s var(--ease-standard) both; }
              }

              @keyframes appear { from { opacity: 0; } }

              /* Rain, snow, birds and planes in calmer colors */

              #weather-effects { filter: saturate(.6); }

              /* On a wide screen, the heading above the card sets the space */

              @media (min-width: 768px) { :host { margin: 0px 0px 0px 0px
              !important; } }
            button_containers:
              - position: custom
                position_anchor: top-left
                padding: 16px 16px 16px 16px
                button_gap: 6px
                buttons:
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: above_horizon
                    elements:
                      - type: icon
                        icon: mdi:weather-sunset-down
                      - type: text
                        entity: sun.sun
                        attribute: next_setting
                        size: 12px
                        weight: '700'
                        color: var(--primary-text-color)
                  - entity: sun.sun
                    visibility:
                      - condition: state
                        entity: sun.sun
                        state: below_horizon
                    elements:
                      - type: icon
                        icon: mdi:weather-sunset-up
                      - type: text
                        entity: sun.sun
                        attribute: next_rising
                        size: 12px
                        weight: '700'
                        color: var(--primary-text-color)
              - position: custom
                position_anchor: top-right
                align: end
                padding: 16px 20px 16px 20px
                buttons:
                  - entity: weather.weather_at_4310
                    style: vertical
                    inner_gap: 6px
                    padding: 0px 0px 0px 0px
                    elements:
                      - type: text
                        attribute: temperature
                        precision: 0
                        format: °
                        size: 40px
                        weight: '700'
                        color: var(--primary-text-color)
                      - type: text
                        size: 12px
                        weight: '500'
          - type: custom:bubble-card
            card_type: separator
            name: Favoriten
            modules:
              - origami_base
              - origami_header
            origami_header:
              icon_size: var(--icon-size-m)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: Alle
                  icon: mdi:chevron-right
                  show_name: true
                  content_layout: icon-right
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_favorites'
          - type: custom:bubble-card
            card_type: sub-buttons
            modules:
              - origami_base
              - origami_tiles
            origami_tiles:
              scroll: true
            grid_options:
              columns: full
              rows: auto
            sub_button:
              bottom:
                - name: Moonlight
                  entity: switch.wohnung_unifi_network_moonlight_tcp
                  icon: mdi:shield-lock-outline
                  force_icon: true
                  show_icon: true
                  origami_tiles:
                    color: var(--red-color)
                    state: >-
                      ${((tcp, udp) => !['on', 'off'].includes(tcp) || !['on',
                      'off'].includes(udp) ? 'Nicht verfügbar' : tcp === udp ?
                      'Aktiv' :
                      'Teilaktiv')(states('switch.wohnung_unifi_network_moonlight_tcp'),
                      states('switch.wohnung_unifi_network_moonlight_udp'))}
                    state_color: >-
                      ${((tcp, udp) => ['on', 'off'].includes(tcp) && ['on',
                      'off'].includes(udp) && tcp !== udp ? 'var(--error-color)'
                      :
                      '')(states('switch.wohnung_unifi_network_moonlight_tcp'),
                      states('switch.wohnung_unifi_network_moonlight_udp'))}
                  visibility:
                    - condition: or
                      conditions:
                        - condition: state
                          entity: switch.wohnung_unifi_network_moonlight_tcp
                          state: 'on'
                        - condition: state
                          entity: switch.wohnung_unifi_network_moonlight_udp
                          state: 'on'
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_network'
                - name: Punktfunk
                  entity: switch.wohnung_unifi_network_punktfunk_udp
                  icon: mdi:shield-lock-outline
                  force_icon: true
                  show_icon: true
                  origami_tiles:
                    color: var(--red-color)
                  visibility:
                    - condition: state
                      entity: switch.wohnung_unifi_network_punktfunk_udp
                      state: 'on'
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_network'
                - name: TV
                  entity: media_player.wohnzimmer_lg_oled_c5
                  icon: mdi:television
                  visibility:
                    - condition: state
                      entity: media_player.wohnzimmer_lg_oled_c5
                      state_not:
                        - 'off'
                        - standby
                        - unavailable
                        - unknown
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_tv'
                  hold_action:
                    action: more-info
                - name: Zutritt
                  entity: binary_sensor.wohnzimmer_nuki_eingang_door_open
                  icon: mdi:door
                  force_icon: true
                  origami_tiles:
                    color: var(--green-color)
                  visibility: []
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_lock'
                  hold_action:
                    action: more-info
                  scrolling_effect: true
                  show_background: true
                  state_background: true
                  show_icon: true
                - name: R2-D2
                  entity: vacuum.r2_d2
                  icon: mdi:robot-vacuum-variant
                  force_icon: true
                  origami_tiles:
                    color: var(--orange-color)
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_vacuum'
                  hold_action:
                    action: more-info
                  show_name: false
                - name: K2 Pro
                  entity: sensor.k2pro_print_status
                  icon: mdi:printer-3d
                  force_icon: true
                  origami_tiles:
                    state:
                      cleaning: Reinigen
                      'false': Aus
                      error: Fehler!
                      self-testing: Selbsttest
                      completed: Fertig
                      paused: Pausiert
                      stopped: Gestoppt
                      printing: Drucken
                      processing: Verarbeiten
                      idle: Ruhezustand
                    color: var(--blue-color)
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_printer'
                  hold_action:
                    action: none
                  double_tap_action:
                    action: none
                - name: Ofen
                  entity: sensor.kuche_ofen_geratestatus
                  timer_entity: number.kuche_ofen_zieldauer
                  force_icon: true
                  origami_tiles:
                    color: var(--purple-color)
                    state:
                      Ready To Start: Startbereit
                      ready to start: Startbereit
                  tap_action:
                    action: navigate
                    navigation_path: '#popup_oven'
                  hold_action:
                    action: more-info
                  show_name: false
                  icon: mdi:stove
                  styles: |
                    ${(() => {
                      setTimeout(() => {
                        const root = card.shadowRoot || card;
                        const timerSt = hass.states['number.kuche_ofen_zieldauer'];
                        const mainSt = hass.states['sensor.kuche_ofen_geratestatus'];
                        const stateEl = root.querySelector('.bubble-state') || root.querySelector('.state') || card.querySelector('.bubble-state');

                        if (stateEl) {
                          const timerVal = timerSt ? parseFloat(timerSt.state) : 0;
                          let displayText = "Startbereit";

                          if (!isNaN(timerVal) && timerVal > 0) {
                            displayText = typeof hass.formatEntityState === "function" 
                              ? hass.formatEntityState(timerSt) 
                              : `${timerSt.state} Min.`;
                          } else if (mainSt) {
                            const rawState = String(mainSt.state).toLowerCase().trim();
                            if (rawState === "ready to start" || rawState === "ready_to_start" || rawState === "off" || rawState === "idle") {
                              displayText = "Startbereit";
                            } else if (typeof hass.formatEntityState === "function") {
                              displayText = hass.formatEntityState(mainSt);
                            } else {
                              displayText = mainSt.state;
                            }
                          }

                          if (stateEl.innerText !== displayText) {
                            stateEl.innerText = displayText;
                          }
                        }
                      }, 0);
                      return "";
                    })()}
            hide_main_background: false
            footer_mode: false
            styles: |-
              .bubble-sub-button-name-container::after {
                max-width: min(var(--org-tile-state-max,100px),100%);
              }
        theme: Origami
      - type: grid
        column_span: 1
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Zimmer
            modules:
              - origami_base
              - origami_header
            origami_header:
              value_style: chip
              icon_size: var(--icon-size-l)
            grid_options:
              columns: full
              rows: auto
            sub_button:
              main:
                - name: Temperature
                  entity: sensor.thermometer_gang_temperatur
                  icon: mdi:thermometer
                  origami_header:
                    name: >-
                      ${(t => t.length ? num(t.reduce((a, b) => a + b, 0) / t.length, 0) + '°' : '–')(
                      ['sensor.thermometer_gang_temperatur', 'sensor.thermometer_schlafzimmer_temperatur',
                      'sensor.thermometer_buero_temperatur', 'sensor.thermometer_bad_temperatur',
                      'sensor.thermometer_dusche_temperatur'].map(id => parseFloat(states(id))).filter(Number.isFinite))}
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.toggle
                    target:
                      entity_id: input_boolean.room_climate_card
                  hold_action:
                    action: more-info
                - name: Windows
                  entity: binary_sensor.buro_fenster
                  icon: mdi:window-closed-variant
                  origami_header:
                    name: >-
                      ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                      'binary_sensor.wohnzimmer_fenster'].filter(id => states(id) === 'on').length}
                    icon: >-
                      ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                      'binary_sensor.wohnzimmer_fenster'].some(id => states(id) === 'on') ? 'mdi:window-open-variant' : ''}
                    name_color: >-
                      ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                      'binary_sensor.wohnzimmer_fenster'].some(id => states(id) === 'on') ?
                      'var(--state-binary_sensor-window-on-color)' :
                      'var(--secondary-text-color)'}
                    background: >-
                      ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                      'binary_sensor.wohnzimmer_fenster'].some(id => states(id) === 'on') ? 'var(--tint)' : ''}
                  tap_action:
                    action: perform-action
                    perform_action: input_boolean.toggle
                    target:
                      entity_id: input_boolean.room_climate_card
                  hold_action:
                    action: more-info
                - name: Table
                  entity: input_boolean.room_climate_card
                  icon: mdi:chevron-down
                  show_background: false
                  origami_header:
                    icon:
                      'on': mdi:chevron-up
                  tap_action:
                    action: toggle
                  hold_action:
                    action: more-info
          - type: custom:bubble-card
            card_type: sub-buttons
            modules:
              - origami_base
              - origami_table
            origami_base:
              animate: true
            origami_table:
              columns:
                - name: room
                  icon: mdi:circle
                  color_template: >-
                    ${(t => [[12, '#728FA8B3'], [15, '#7C97A9B3'], [17, '#8BA2A8B3'], [18.5, '#9AAEA3B3'],
                    [22, '#88A37EB3'], [24, '#99A677B3'], [25, '#AEA76FB3'], [26, '#BB9F68B3'],
