                        line:
                          color: $ex vars.cRam
                        fill: tozeroy
                        fillgradient:
                          type: vertical
                          colorscale: $ex [[0, "rgba(0,0,0,0)"], [1, vars.cRam + "52"]]
                        hovertemplate: '%{y:.0f} %<extra>RAM</extra>'
                        filters: '$ex [...get("smooth_filters"), { store_var: "ram" }]'
                      - entity: sensor.system_monitor_prozessornutzung
                        name: CPU
                        line:
                          color: $ex vars.cCpu
                        fill: tozeroy
                        fillgradient:
                          type: vertical
                          colorscale: $ex [[0, "rgba(0,0,0,0)"], [1, vars.cCpu + "52"]]
                        hovertemplate: '%{y:.0f} %<extra>CPU</extra>'
                        filters: '$ex [...get("smooth_filters"), { store_var: "cpu" }]'
                      - entity: sensor.system_monitor_prozessornutzung
                        name: max cpu
                        hoverinfo: skip
                        hovertemplate: null
                        mode: markers+text
                        cliponaxis: false
                        texttemplate: <b>%{y:.0f}%</b>
                        textposition: top center
                        textfont:
                          size: 11
                          color: $ex vars.cCpu
                        marker:
                          size: 6
                          color: $ex vars.cBg
                          line:
                            width: 2
                            color: $ex vars.cCpu
                        filters: $ex [...get("smooth_filters"), ...get("max_marker")]
                      - entity: sensor.system_monitor_arbeitsspeicherauslastung
                        name: max ram
                        hoverinfo: skip
                        hovertemplate: null
                        mode: markers+text
                        cliponaxis: false
                        texttemplate: <b>%{y:.0f}%</b>
                        textposition: top center
                        textfont:
                          size: 11
                          color: $ex vars.cRam
                        marker:
                          size: 6
                          color: $ex vars.cBg
                          line:
                            width: 2
                            color: $ex vars.cRam
                        filters: $ex [...get("smooth_filters"), ...get("max_marker")]
                    layout:
                      height: 130
                      dragmode: false
                      paper_bgcolor: |-
                        $fn () => {
                          try {
                            const fix = (root) => {
                              if (!root || !root.querySelectorAll) return;
                              root.querySelectorAll("plotly-graph").forEach((el) => {
                                el.style.setProperty("--ha-card-box-shadow", "none");
                                el.style.setProperty("--ha-card-border-width", "0px");
                              });
                              root.querySelectorAll("*").forEach((n) => {
                                if (n.tagName && n.tagName.includes("-") && n.shadowRoot) fix(n.shadowRoot);
                              });
                            };
                            fix(document);
                          } catch (e) {}
                          return "rgba(0,0,0,0)";
                        }
                      plot_bgcolor: rgba(0,0,0,0)
                      hovermode: x unified
                      showlegend: false
                      font:
                        family: Montserrat, sans-serif
                        size: 13
                      margin:
                        t: 18
                        b: 30
                        l: 36
                        r: 86
                      hoverlabel:
                        font:
                          family: Montserrat, sans-serif
                          size: 12
                      annotations: |-
                        $fn ({ vars }) => {
                          const last = (s) => {
                            const ys = (s && s.ys) || [];
                            for (let i = ys.length - 1; i >= 0; i--) {
                              if (ys[i] != null && isFinite(+ys[i])) return +ys[i];
                            }
                            return null;
                          };
                          const cpu = last(vars.cpu), ram = last(vars.ram);
                          if (cpu == null || ram == null) return [];
                          // The two chips keep apart, and stay inside the graph
                          let yc = cpu, yr = ram;
                          if (Math.abs(yc - yr) < 22) {
                            const mid = Math.min(Math.max((yc + yr) / 2, 11), 91);
                            if (yc < yr) { yc = mid - 11; yr = mid + 11; }
                            else { yc = mid + 11; yr = mid - 11; }
                          }
                          const chip = (label, val, y, color) => ({
                            xref: "paper", x: 1, xanchor: "left", xshift: 8,
                            yref: "y", y: y, showarrow: false, borderpad: 4,
                            text: "<b>" + label + " " + Math.round(val) + "%</b>",
                            font: { size: 11, color: vars.cBg }, bgcolor: color,
                          });
                          return [chip("CPU", cpu, yc, vars.cCpu), chip("RAM", ram, yr, vars.cRam)];
                        }
                      xaxis:
                        showgrid: false
                        showline: false
                        ticks: ''
                        nticks: 6
                        tickfont:
                          size: 12
                        showspikes: true
                        spikemode: across
                        spikethickness: -2
                        spikedash: solid
                        spikecolor: rgba(128,128,128,0.5)
                        tickformatstops:
                          - dtickrange:
                              - null
                              - 86400000
                            value: '%H:%M'
                          - dtickrange:
                              - 86400000
                              - null
                            value: '%b %d'
                      yaxis:
                        range:
                          - 0
                          - 102
                        tickvals:
                          - 50
                          - 100
                        ticktext:
                          - 50%
                          - 100%
                      shapes:
                        - type: line
                          xref: paper
                          x0: 0
                          x1: 1
                          yref: 'y'
                          y0: 90
                          y1: 90
                          layer: below
                          line:
                            width: 1
                            dash: dot
                            color: $ex vars.cErr + "8C"
                    config:
                      displayModeBar: false
        column_span: 1
        theme: Origami
      - type: grid
        cards:
          - type: grid
            square: false
            columns: 1
            visibility:
              - condition: screen
                media_query: ''
            cards:
              - type: custom:bubble-card
                card_type: sub-buttons
                modules:
                  - origami_base
                  - origami_button
                origami_button:
                  columns: 3
                  background: false
                  icon_size: 27px
                  padding: var(--ha-space-5)
                sub_button:
                  main: []
                  bottom:
                    - entity: zone.home
                      name: Home
                      icon: mdi:account-group-outline
                      show_name: true
                      content_layout: icon-top
                      origami_button:
                        name: "${num(state, 0) || '–'} Personen"
                        label: Home
                        color: "${Number(state) === 0 ? 'var(--secondary-text-color)' : 'var(--success-color)'}"
                      tap_action:
                        action: more-info
                    - entity: binary_sensor.wohnzimmer_nuki_eingang_door_open
                      name: Tür
                      icon: mdi:lock-outline
                      show_name: true
                      content_layout: icon-top
                      origami_button:
                        name: "${state === 'on' ? 'Offen' : state === 'off' ? 'Geschlossen' : '–'}"
                        icon: "${state === 'on' ? 'mdi:lock-open-variant-outline' : ''}"
                        label: Tür
                        color: "${state === 'on' ? 'var(--error-color)' : state === 'off' ? 'var(--success-color)' : 'var(--secondary-text-color)'}"
                      tap_action:
                        action: more-info
                        entity: lock.nuki_eingang_lock
                    - name: Fenster
                      icon: mdi:window-open-variant
                      show_name: true
                      content_layout: icon-top
                      origami_button:
                        name: >-
                          ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                          'binary_sensor.wohnzimmer_fenster'].filter(id => states(id) === 'on').length} offen
                        icon: >-
                          ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                          'binary_sensor.wohnzimmer_fenster'].some(id => states(id) === 'on') ? '' : 'mdi:window-closed-variant'}
                        label: Fenster
                        color: >-
                          ${['binary_sensor.buro_fenster', 'binary_sensor.schlafzimmer_fenster',
                          'binary_sensor.wohnzimmer_fenster'].some(id => states(id) === 'on')
                          ? 'var(--primary-text-color)' : 'var(--secondary-text-color)'}
                      tap_action:
                        action: perform-action
                        perform_action: input_boolean.toggle
                        target:
                          entity_id: input_boolean.room_climate_card
                styles: |-
                  ha-card {
                    background: var(--fill-subtle);
                    border-radius: var(--ha-card-border-radius);
                  }
        column_span: 1
        theme: Origami
    theme: Origami
    cards: []
