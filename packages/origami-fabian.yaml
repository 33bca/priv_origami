# The Origami helpers as a package. Copy this file to /config/packages/ and replace the example entities with your own.
# Packages need these lines in configuration.yaml.
#
# homeassistant:
#   packages: !include_dir_named packages

input_boolean:
  # Opens the climate table under the rooms header
  room_climate_card:
    name: Zimmer Klima-Tabelle
    icon: mdi:table
  # Shows the rooms beyond the first four
  all_rooms:
    name: Alle Zimmer
    icon: mdi:home-group

input_select:
  # Fallback for the active speaker when nothing plays
  selected_speaker:
    name: Aktiver Lautsprecher
    options:
      - media_player.wohnzimmer
      - media_player.eingang
      - media_player.roam
      - media_player.buro

template:
  - number:
      - name: Gruppenlautstärke
        unique_id: group_volume
        default_entity_id: number.group_volume
        unit_of_measurement: "%"
        min: 0
        max: 100
        step: 1
        state: >
          {% set s = states('input_select.selected_speaker') %}
          {% set v = (state_attr(s, 'group_members') or [s])
             | map('state_attr', 'volume_level') | select('number') | list %}
          {{ (v | sum / v | count * 100) | round if v else 0 }}
        set_value:
          - action: script.set_group_volume
            data:
              speaker: input_select.selected_speaker
              volume: "{{ value }}"
  - sensor:
      # Room climate, one sensor for each room. Copy the block and replace the source sensors.
      - name: Klima | Wohnzimmer
        unique_id: climate_living_room
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.thermometer_gang_temperatur') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.thermometer_gang_temperatur') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.thermometer_gang_luftfeuchtigkeit') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'living_room')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'living_room')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'living_room')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'living_room')
               else 'normal' }}
          # Comfort color on a soft scale from blue at 12° to red above 32°
          color_code: >
            {% set t = states('sensor.thermometer_gang_temperatur') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      - name: Klima | Schlafzimmer
        unique_id: climate_bedroom
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.thermometer_schlafzimmer_temperatur') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.thermometer_schlafzimmer_temperatur') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.thermometer_schlafzimmer_luftfeuchtigkeit') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'bedroom')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'bedroom')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'bedroom')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'bedroom')
               else 'normal' }}
          color_code: >
            {% set t = states('sensor.thermometer_schlafzimmer_temperatur') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      - name: Klima | Büro
        unique_id: climate_office
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.thermometer_buero_temperatur') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.thermometer_buero_temperatur') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.thermometer_buero_luftfeuchtigkeit') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'office')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'office')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'office')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'office')
               else 'normal' }}
          color_code: >
            {% set t = states('sensor.thermometer_buero_temperatur') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      - name: Klima | Bad
        unique_id: climate_bathroom
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.thermometer_bad_temperatur') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.thermometer_bad_temperatur') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.thermometer_bad_luftfeuchtigkeit') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'bathroom')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'bathroom')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'bathroom')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'bathroom')
               else 'normal' }}
          color_code: >
            {% set t = states('sensor.thermometer_bad_temperatur') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      - name: Klima | Balkon
        unique_id: climate_balcony
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.vindstyrka_temperature') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.vindstyrka_temperature') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.vindstyrka_humidity') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'balcony')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'balcony')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'balcony')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'balcony')
               else 'normal' }}
          color_code: >
            {% set t = states('sensor.vindstyrka_temperature') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      - name: Klima | Dusche
        unique_id: climate_shower
        icon: mdi:thermometer
        state: >
          {% set t = states('sensor.thermometer_dusche_temperatur') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature: >
            {% set t = states('sensor.thermometer_dusche_temperatur') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity: >
            {% set h = states('sensor.thermometer_dusche_luftfeuchtigkeit') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          temp_rank: >
            {{ 'warmest' if is_state('sensor.climate_temperature_peaks', 'shower')
               else 'coldest' if is_state_attr('sensor.climate_temperature_peaks', 'lowest', 'shower')
               else 'normal' }}
          humidity_rank: >
            {{ 'most_humid' if is_state('sensor.climate_humidity_peaks', 'shower')
               else 'driest' if is_state_attr('sensor.climate_humidity_peaks', 'lowest', 'shower')
               else 'normal' }}
          color_code: >
            {% set t = states('sensor.thermometer_dusche_temperatur') | float(20) %}
            {% set scale = [(12, '114, 143, 168'), (15, '124, 151, 169'), (17, '139, 162, 168'),
               (18.5, '154, 174, 163'), (22, '136, 163, 126'), (24, '153, 166, 119'),
               (25, '174, 167, 111'), (26, '187, 159, 104'), (27, '192, 147, 95'),
               (28, '191, 138, 95'), (29, '187, 126, 93'), (30.5, '179, 115, 92'),
               (32, '170, 106, 90'), (99, '156, 96, 86')] %}
            rgba({{ (scale | selectattr(0, '>=', t) | first)[1] }}, 0.7)

      # The warmest, coldest, most humid and driest room
      - name: Klima | Temperatur-Peaks
        unique_id: climate_temperature_peaks
        icon: mdi:thermometer
        state: >
          {% set ns = namespace(p=[]) %}
          {% for r in ['living_room', 'bedroom', 'office', 'bathroom', 'shower'] %}
            {% set v = states('sensor.' ~ r ~ '_temperature') | float(none) %}
            {% if v is not none %}{% set ns.p = ns.p + [(v, r)] %}{% endif %}
          {% endfor %}
          {{ (ns.p | max)[1] if ns.p | count > 1 and (ns.p | max)[0] > (ns.p | min)[0] else 'none' }}
        attributes:
          lowest: >
            {% set ns = namespace(p=[]) %}
            {% for r in ['living_room', 'bedroom', 'office', 'bathroom', 'shower'] %}
              {% set v = states('sensor.' ~ r ~ '_temperature') | float(none) %}
              {% if v is not none %}{% set ns.p = ns.p + [(v, r)] %}{% endif %}
            {% endfor %}
            {{ (ns.p | min)[1] if ns.p | count > 1 and (ns.p | max)[0] > (ns.p | min)[0] else 'none' }}

      - name: Klima | Luftfeuchtigkeit-Peaks
        unique_id: climate_humidity_peaks
        icon: mdi:water-percent
        state: >
          {% set ns = namespace(p=[]) %}
          {% for r in ['living_room', 'bedroom', 'office', 'bathroom', 'shower'] %}
            {% set v = states('sensor.' ~ r ~ '_humidity') | float(none) %}
            {% if v is not none %}{% set ns.p = ns.p + [(v, r)] %}{% endif %}
          {% endfor %}
          {{ (ns.p | max)[1] if ns.p | count > 1 and (ns.p | max)[0] > (ns.p | min)[0] else 'none' }}
        attributes:
          lowest: >
            {% set ns = namespace(p=[]) %}
            {% for r in ['living_room', 'bedroom', 'office', 'bathroom', 'shower'] %}
              {% set v = states('sensor.' ~ r ~ '_humidity') | float(none) %}
              {% if v is not none %}{% set ns.p = ns.p + [(v, r)] %}{% endif %}
            {% endfor %}
            {{ (ns.p | min)[1] if ns.p | count > 1 and (ns.p | max)[0] > (ns.p | min)[0] else 'none' }}

      # Averages over all rooms
      - name: Temperatur-Durchschnitt
        unique_id: temperature_average
        unit_of_measurement: "°C"
        device_class: temperature
        state: >
          {% set sensors = [
            'sensor.thermometer_gang_temperatur',
            'sensor.thermometer_schlafzimmer_temperatur',
            'sensor.thermometer_buero_temperatur',
            'sensor.thermometer_bad_temperatur',
            'sensor.thermometer_dusche_temperatur'
          ] %}
          {% set v = sensors | map('states') | map('float', none) | reject('none') | list %}
          {{ (v | sum / v | count) | round(1) if v else none }}

      - name: Luftfeuchtigkeit-Durchschnitt
        unique_id: humidity_average
        unit_of_measurement: "%"
        device_class: humidity
        state: >
          {% set sensors = [
            'sensor.thermometer_gang_luftfeuchtigkeit',
            'sensor.thermometer_schlafzimmer_luftfeuchtigkeit',
            'sensor.thermometer_buero_luftfeuchtigkeit',
            'sensor.thermometer_bad_luftfeuchtigkeit',
            'sensor.thermometer_dusche_luftfeuchtigkeit'
          ] %}
          {% set v = sensors | map('states') | map('float', none) | reject('none') | list %}
          {{ (v | sum / v | count) | round(0) if v else none }}

      # The whole home
      - name: Klima | Gesamt
        unique_id: climate_home
        icon: mdi:home-thermometer
        state: >
          {% set t = states('sensor.temperature_average') | float(none) %}
          {{ t | round(1) if t is not none else '?' }}
        attributes:
          temperature_average: >
            {% set t = states('sensor.temperature_average') | float(none) %}
            {{ t | round(0) | int if t is not none else '?' }}
          humidity_average: >
            {% set h = states('sensor.humidity_average') | float(none) %}
            {{ h | round(0) | int if h is not none else '?' }}
          windows_open: >
            {% set w = states('sensor.windows_open_count') %}
            {{ '?' if w in ['unknown', 'unavailable'] else w }}
          front_door_open: >
            {{ states('binary_sensor.wohnzimmer_nuki_eingang_door_open') }}

      - name: Offene Fenster
        unique_id: windows_open_count
        icon: mdi:window-open-variant
        state: >
          {{ ['binary_sensor.buro_fenster',
              'binary_sensor.schlafzimmer_fenster',
              'binary_sensor.wohnzimmer_fenster']
             | select('is_state', 'on') | list | count }}

      # Greeting
      - name: Greetings
        unique_id: greetings
        icon: mdi:hand-wave
        state: >
          {% set h = now().hour %}
          {% set h = now().hour %}
          {% if h < 5 %}Noch wach?
          {% elif h < 22 %}Na, hallo!
          {% else %}Schlaf gut!{% endif %}

      # The living room scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Wohnzimmer Szenen
        unique_id: living_room_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.wohnzimmer_wohnen', 'on') %}
            {% set current_scene = states('select.wohnzimmer_wohnen_szene') | lower %}
            {% set mapping = [
              ('nightlight', 'nacht'),
              ('read', 'lesen'),
              ('entspannen', 'entspannen'),
              ('ruhe', 'ruhe')
            ] %}
            {% set ns = namespace(match=none) %}
            {% for pattern, result in mapping %}
              {% if ns.match is none and current_scene is search(pattern) %}
                {% set ns.match = result %}
              {% endif %}
            {% endfor %}
            {{ ns.match if ns.match is not none else current_scene | slugify }}
          {% else %}
            none
          {% endif %}

      # The balcony scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Balkon Szenen
        unique_id: balcony_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.balkon_raum', 'on') %}
            {% set current_scene = states('select.balkon_raum_szene') | lower %}
            {% set mapping = {
              'nachtlicht': 'nacht',
            } %}
            {{ mapping.get(current_scene, current_scene | slugify) }}
          {% else %}
            none
          {% endif %}

      # The bedroom scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Schlafzimmer Szenen
        unique_id: bedroom_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.schlafzimmer_raum', 'on') %}
            {% set current_scene = states('select.schlafzimmer_raum_szene') | lower %}
            {% set mapping = {
              'dark': 'nacht',
              'chillo mode': 'gemütlich',
            } %}
            {{ mapping.get(current_scene, current_scene | slugify) }}
          {% else %}
            none
          {% endif %}

      # The office scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Büro Szenen
        unique_id: office_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.buro_raum', 'on') %}
            {% set current_scene = states('select.buro_raum_szene') | lower %}
            {% set mapping = {
              'fuchsia frost': 'mood',
            } %}
            {{ mapping.get(current_scene, current_scene | slugify) }}
          {% else %}
            none
          {% endif %}

      # The bathroom scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Bad Szenen
        unique_id: bathroom_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.badezimmer_raum', 'on') %}
            {% set current_scene = states('select.badezimmer_raum_szene') | lower %}
            {% set mapping = {
              'ruhe': 'gemütlich',
            } %}
            {{ mapping.get(current_scene, current_scene | slugify) }}
          {% else %}
            none
          {% endif %}

      # The shower scene that was turned on last, such as evening. The state is none while the lights are off.
      - name: Dusche Szenen
        unique_id: shower_scene
        icon: mdi:palette-outline
        state: >
          {% if is_state('light.dusche_raum', 'on') %}
            {% set current_scene = states('select.dusche_raum_szene') | lower %}
            {% set mapping = {
              'ruhe': 'gemütlich',
            } %}
            {{ mapping.get(current_scene, current_scene | slugify) }}
          {% else %}
            none
          {% endif %}

      # Counters for the navbar badges
      - name: Lichter an Anzahl
        unique_id: lights_on_count
        icon: mdi:lightbulb-group
        state: >
          {{ ['light.wohnzimmer_wohnen', 'light.schlafzimmer_raum', 'light.buro_raum',
              'light.badezimmer_raum', 'light.balkon_raum', 'light.dusche_raum']
             | select('is_state', 'on') | list | count }}

      - name: Aktive Lautsprecher Anzahl
        unique_id: active_speaker_count
        icon: mdi:speaker-multiple
        state: >
          {{ ['media_player.wohnzimmer', 'media_player.roam',
              'media_player.eingang', 'media_player.buro']
             | select('is_state', ['playing', 'buffering']) | list | count }}

      # The most relevant speaker, for the card above the navigation bar.
      # A playing speaker comes first, then a speaker on a TV input or Bluetooth, then a paused speaker,
      # and then the selected speaker.
      # A playing group leader comes before its members.
      - name: Aktives Ziel
        unique_id: active_target
        icon: mdi:target
        state: >
          {% set players = ['media_player.wohnzimmer', 'media_player.buro',
             'media_player.roam', 'media_player.eingang'] %}
          {% set dead = ['off', 'standby', 'unknown', 'unavailable', ''] %}
          {% set ns = namespace(playing=[], physical=[], paused=[]) %}

          {% for p in players %}
            {% set s = states(p) %}
            {% set src = state_attr(p, 'source') | default('', true)
               | lower | replace('-', ' ') %}
            {% set is_physical = 'optical' in src or 'coax' in src
               or 'hdmi' in src or 'line in' in src or 'bluetooth' in src %}
            {% if s not in dead %}
              {% if s in ['playing', 'buffering', 'on'] %}
                {% set ns.playing = ns.playing + [p] %}
              {% elif is_physical %}
                {% set ns.physical = ns.physical + [p] %}
              {% elif s == 'paused' %}
                {% set ns.paused = ns.paused + [p] %}
              {% endif %}
            {% endif %}
          {% endfor %}

          {# The first of group_members leads the group #}
          {% set lead = (state_attr(ns.playing | first, 'group_members') or [none])[0]
             if ns.playing else none %}
          {% set chain = ns.playing + ns.physical + ns.paused
             + [states('input_select.selected_speaker')] %}
          {{ lead if lead in ns.playing else (chain | first) }}

      # What the active speaker plays, prepared for the dashboard.
      # Each attribute first checks that the entity is currently active, because
      # Music Assistant keeps the last title while it is idle.
      # The Music Assistant player (the _mass entity) also reports playing while the speaker
      # uses one of its own sources, such as Bluetooth or Spotify. Its data therefore only counts while no such source is active.
      - name: Aktiver Lautsprecher
        unique_id: active_speaker
        icon: mdi:speaker-play
        state: >
          {{ states('sensor.active_target') }}
        attributes:

          # playing_art | playing_plain | paused_art | paused_plain
          # tv_art | tv_plain | off
          chip: >
            {% set z = states('sensor.active_target') %}
            {% set s = states(z) %}
            {% set src = state_attr(z, 'source') | default('', true)
               | lower | replace('-', ' ') %}
            {% set own = ['bluetooth', 'optical', 'coax', 'hdmi', 'line in', 'phono',
               'usb', 'udisk', 'spotify', 'qobuz', 'tidal', 'deezer',
               'amazon', 'napster', 'tunein', 'airplay'] %}
            {% set ma = states(z ~ '_mass') in ['playing', 'paused', 'buffering']
               and not (own | select('in', src) | list) %}

            {% if s in ['off', 'standby', 'unknown', 'unavailable'] %}
              off
            {% elif 'optical' in src or 'coax' in src
                 or 'hdmi' in src or 'line in' in src %}
              {% set tvart = state_attr('sensor.tv_source', 'artwork')
                 | default('none', true) %}
              {{ 'tv_art' if tvart not in ['none', 'unknown', ''] else 'tv_plain' }}
            {% else %}
              {% set status = 'playing' if s in ['playing', 'buffering', 'on']
                 else ('paused' if s == 'paused' else 'off') %}
              {% set cover = state_attr(z ~ '_mass', 'entity_picture') if ma else none %}
              {{ 'off' if status == 'off'
                 else status ~ ('_art' if cover else '_plain') }}
            {% endif %}

          # yes or no, for the group badge
          group: >
            {% set z = states('sensor.active_target') %}
            {% set members = state_attr(z, 'group_members') or [] %}
            {{ 'yes' if (members | reject('equalto', z) | list | length) > 0
               else 'no' }}

          # The short name, with a count when grouped, such as "Living +2"
          speaker: >
            {% set z = states('sensor.active_target') %}
            {% set short = {
              'media_player.wohnzimmer': 'Wohnzimmer',
              'media_player.roam':       'Roam',
              'media_player.eingang':    'Eingang',
              'media_player.buro':       'Büro' } %}
            {% set n = short.get(z, state_attr(z, 'friendly_name'))
               | default('Speaker', true) %}
            {% set members = state_attr(z, 'group_members') or [] %}
            {% set others = members | reject('equalto', z) | list | length %}
            {{ n ~ (' +' ~ others if others > 0 else '') }}

          # The text to show. It is never empty and never outdated.
          title: >
            {% set z = states('sensor.active_target') %}
            {% set s = states(z) %}
            {% set src = state_attr(z, 'source') | default('', true)
               | lower | replace('-', ' ') %}
            {% set live = ['playing', 'paused', 'buffering'] %}
            {% set own = ['bluetooth', 'optical', 'coax', 'hdmi', 'line in', 'phono',
               'usb', 'udisk', 'spotify', 'qobuz', 'tidal', 'deezer',
               'amazon', 'napster', 'tunein', 'airplay'] %}
            {% set ma = states(z ~ '_mass') in live
               and not (own | select('in', src) | list) %}

            {% if s in ['off', 'standby', 'unavailable', 'unknown'] %}
              Nothing playing
            {% elif 'bluetooth' in src %}
              Bluetooth
            {% elif 'optical' in src or 'coax' in src
                 or 'hdmi' in src or 'line in' in src %}
              {{ state_attr('sensor.tv_source', 'display')
                 | default('TV', true) }}
            {% else %}
              {% set t = (state_attr(z ~ '_mass', 'media_title') if ma else none)
                 or (state_attr(z, 'media_title') if s in live else none) %}
              {% set a = (state_attr(z ~ '_mass', 'media_artist') if ma else none)
                 or (state_attr(z, 'media_artist') if s in live else none) %}
              {% if t and ('http://' in t or 'https://' in t) %}
                {% set t = none %}
              {% endif %}
              {{ (t ~ ' | ' ~ a) if (t and a)
                 else (t if t
                 else ({'paused': 'Paused', 'buffering': 'Buffering'})
                       .get(s, 'Nothing playing')) }}
            {% endif %}

          # The TV picture while the TV input is active, and the music cover at other times.
          # Bluetooth has no picture on purpose.
          artwork: >
            {% set z = states('sensor.active_target') %}
            {% set src = state_attr(z, 'source') | default('', true)
               | lower | replace('-', ' ') %}
            {% set live = ['playing', 'paused', 'buffering'] %}
            {% set own = ['bluetooth', 'optical', 'coax', 'hdmi', 'line in', 'phono',
               'usb', 'udisk', 'spotify', 'qobuz', 'tidal', 'deezer',
               'amazon', 'napster', 'tunein', 'airplay'] %}
            {% set ma = states(z ~ '_mass') in live
               and not (own | select('in', src) | list) %}

            {% if 'optical' in src or 'coax' in src
               or 'hdmi' in src or 'line in' in src %}
              {{ state_attr('sensor.tv_source', 'artwork')
                 | default('none', true) }}
            {% elif 'bluetooth' in src %}
              none
            {% else %}
              {{ (state_attr(z ~ '_mass', 'entity_picture') if ma else none)
                 or (state_attr(z, 'entity_picture')
                    if states(z) in live else none)
                 or 'none' }}
            {% endif %}

script:
  playback:
    alias: Playback
    description: Controls playback on the selected speaker or its group.
    mode: queued
    fields:
      speaker:
        description: The dropdown helper that selects the speaker, or a speaker
        example: input_select.selected_speaker
        selector:
          entity:
            domain:
              - input_select
              - media_player
      command:
        description: What to do with the speaker
        example: play_pause
        selector:
          select:
            options:
              - play_pause
              - previous_track
              - next_track
              - shuffle
              - favorite
    sequence:
      - variables:
          selected: "{{ states(speaker) if speaker.startswith('input_select.') else speaker }}"
          leader: "{{ (state_attr(selected, 'group_members') or [selected])[0] }}"
      - choose:
          - alias: Shuffle
            conditions: "{{ command == 'shuffle' }}"
            sequence:
              - action: media_player.shuffle_set
                target:
                  entity_id: "{{ leader }}"
                data:
                  shuffle: "{{ not state_attr(leader, 'shuffle') }}"
          - alias: Favorite
            conditions: "{{ command == 'favorite' }}"
            sequence:
              - variables:
                  device: "{{ device_id(selected) }}"
                  button: >-
                    {{ (integration_entities('music_assistant') | select('match', 'button\\.')
                    | select('in', device_entities(device) if device else []) | list + [''])[0] }}
              - condition: template
                value_template: "{{ button != '' }}"
              - action: button.press
                target:
                  entity_id: "{{ button }}"
        default:
          - action: "media_player.media_{{ command }}"
            target:
              entity_id: "{{ leader }}"

  set_group_volume:
    alias: Set group volume
    description: Sets the volume of the selected speaker and its group, preserving the balance between speakers.
    mode: queued
    fields:
      speaker:
        description: The dropdown helper that selects the speaker, or a speaker
        example: input_select.selected_speaker
        selector:
          entity:
            domain:
              - input_select
              - media_player
      volume:
        description: The new volume in percent
        example: 20
        selector:
          number:
            min: 0
            max: 100
            unit_of_measurement: "%"
    sequence:
      - variables:
          selected: "{{ states(speaker) if speaker.startswith('input_select.') else speaker }}"
          members: "{{ state_attr(selected, 'group_members') or [selected] }}"
          levels: "{{ members | map('state_attr', 'volume_level') | select('number') | list }}"
          before: "{{ levels | sum / levels | count if levels else 0 }}"
          after: "{{ volume | float(0) / 100 }}"
      - repeat:
          for_each: "{{ members }}"
          sequence:
            - action: media_player.volume_set
              target:
                entity_id: "{{ repeat.item }}"
              data:
                volume_level: >-
                  {% set level = state_attr(repeat.item, 'volume_level') | float(0) %}
                  {% set wanted = level * after / before if before > 0 else after %}
                  {{ 0 if after == 0 else ([[wanted, 0.01 if level > 0 else 0] | max, 1] | min) | round(2) }}

  group_speakers:
    alias: Group speakers
    description: Adds or removes speakers from the selected speaker group.
    mode: queued
    fields:
      speaker:
        description: The dropdown helper that selects the speaker, or a speaker
        example: input_select.selected_speaker
        selector:
          entity:
            domain:
              - input_select
              - media_player
      member:
        description: The speaker to add to the group or remove from it
        example: media_player.roam
        selector:
          entity:
            domain: media_player
      all:
        description: Adds every available speaker that is not playing or using an input
        example: true
      ungroup:
        description: Ends the speaker group
        example: true
    sequence:
      - variables:
          selected: "{{ states(speaker) if speaker.startswith('input_select.') else speaker }}"
          leader: "{{ (state_attr(selected, 'group_members') or [selected])[0] }}"
          members: "{{ state_attr(leader, 'group_members') or [leader] }}"
      - choose:
          - alias: End the group
            conditions: "{{ ungroup | default(false) and members | count > 1 }}"
            sequence:
              - action: media_player.unjoin
                target:
                  entity_id: "{{ members[1:] }}"
          - alias: Add every free speaker
            conditions: "{{ all | default(false) }}"
            sequence:
              - variables:
                  free: >-
                    {% set ns = namespace(free=[]) %}
                    {% for s in state_attr(speaker, 'options') or [] %}
                      {% if s not in members
                         and states(s) not in ['playing', 'buffering', 'unavailable', 'unknown']
                         and (state_attr(s, 'source') or '') is not search('bluetooth|optical|coax|hdmi|line|aux', ignorecase=true) %}
                        {% set ns.free = ns.free + [s] %}
                      {% endif %}
                    {% endfor %}
                    {{ ns.free }}
              - if: "{{ free | count > 0 }}"
                then:
                  - action: media_player.join
                    target:
                      entity_id: "{{ leader }}"
                    data:
                      group_members: "{{ free }}"
          - alias: Take the speaker out
            conditions: "{{ member is defined and member in members }}"
            sequence:
              - action: media_player.unjoin
                target:
                  entity_id: "{{ selected if member == leader else member }}"
          - alias: Add the speaker
            conditions: "{{ member is defined }}"
            sequence:
              - action: media_player.join
                target:
                  entity_id: "{{ leader }}"
                data:
                  group_members:
                    - "{{ member }}"

  # Volume in small steps, for the TV pop-up
  volume:
    alias: Lautstärke Schritt
    description: Turns a speaker up or down in small steps, or mutes it.
    mode: queued
    fields:
      speaker:
        description: The media player
        example: media_player.living_room
        selector:
          entity:
            domain: media_player
      step:
        description: How much to change the volume, from -1 to 1
        example: 0.05
      mute:
        description: Mutes or unmutes instead
        example: true
    sequence:
      - if:
          - condition: template
            value_template: "{{ mute | default(false) | bool }}"
        then:
          - action: media_player.volume_mute
            target:
              entity_id: "{{ speaker }}"
            data:
              is_volume_muted: "{{ not state_attr(speaker, 'is_volume_muted') }}"
        else:
          - action: media_player.volume_set
            target:
              entity_id: "{{ speaker }}"
            data:
              volume_level: >
                {{ [[state_attr(speaker, 'volume_level') | float(0) + step | float(0), 0] | max, 1] | min | round(2) }}

  # Used by the plus and minus buttons on the thermostat cards
  thermostat_step:
    alias: Thermostat Schritt
    description: Moves a thermostat's target temperature up or down.
    mode: queued
    fields:
      thermostat:
        description: The thermostat
        example: climate.living_room
        selector:
          entity:
            domain: climate
      step:
        description: How far, in degrees
        example: -0.5
    sequence:
      - action: climate.set_temperature
        target:
          entity_id: "{{ thermostat }}"
        data:
          temperature: >
            {% set t = state_attr(thermostat, 'temperature') | float(20) + step | float(0) %}
            {{ [[t, state_attr(thermostat, 'min_temp') | float(7)] | max, state_attr(thermostat, 'max_temp') | float(35)] | min }}

  # Everything off, at the bottom of a room pop-up
  room_off:
    alias: Raum aus
    description: Turns off the lights, media players and switches in one or multiple areas.
    fields:
      area:
        description: The area or areas
        example: living_room
        selector:
          area:
            multiple: true
    sequence:
      - repeat:
          for_each: "{{ [area] if area is string else area }}"
          sequence:
            - variables:
                current_area: "{{ repeat.item }}"
            - repeat:
                for_each: [light, media_player, switch]
                sequence:
                  # Only domains that the area has. Calling a domain that is not set up would stop the script.
                  - if: "{{ expand(area_entities(current_area)) | selectattr('domain', 'eq', repeat.item) | list | count > 0 }}"
                    then:
                      - action: "{{ repeat.item }}.turn_off"
                        target:
                          area_id: "{{ current_area }}"
                        continue_on_error: true

  # Set position and tilt position for one or multiple covers
  cover_preset:
    alias: Beschattung Position
    description: Sets the position and tilt position for one or multiple covers.
    fields:
      target_cover:
        description: The cover entity or list of entities
        example: cover.living_room_blind
        selector:
          entity:
            domain: cover
            multiple: true
      position:
        description: Target position percentage
        example: 1
        default: 1
        selector:
          number:
            min: 0
            max: 100
      tilt_position:
        description: Target tilt position percentage
        example: 40
        default: 40
        selector:
          number:
            min: 0
            max: 100
    sequence:
      - action: cover.set_cover_position
        target:
          entity_id: "{{ target_cover }}"
        data:
          position: "{{ position }}"
      - action: cover.set_cover_tilt_position
        target:
          entity_id: "{{ target_cover }}"
        data:
          tilt_position: "{{ tilt_position }}"
